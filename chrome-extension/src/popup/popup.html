<!DOCTYPE html>
<html>
<head>
    <title>Firebase Auth Extension</title>
    <style>
        body {
            width: 300px;
            padding: 10px;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
            cursor: pointer;
        }
        #statusMessage {
            margin-top: 10px;
            padding: 8px;
            display: none;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
    </style>
</head>
<body>
    <h1>Firebase Auth Extension</h1>
    <div id="userInfo"></div>
    <button id="signInButton">Sign In</button>
    <button id="signOutButton" style="display:none;">Sign Out</button>
    <button id="screenshotButton" style="display:none;">Take Screenshot</button>
    <div id="statusMessage"></div>
    <script src="popup.js"></script>
</body>
</html>
